<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="다이아몬드 매니저">
  <!-- 야구 다이아몬드(내야) — 게임 이름 그대로의 모양이라 16px 에서도 읽힌다.
       배경을 깔지 않고 투명으로 둬서 밝은/어두운 탭 바 양쪽에서 다 보인다.
       가운데를 어둡게 파낸 것은 초록 고리만 남기기 위해서다 — 흰 탭 바에서
       속을 밝게 두면 고리가 사라진다. -->
  <path d="M16 2 30 16 16 30 2 16Z" fill="#2e7d32"/>
  <path d="M16 9 23 16 16 23 9 16Z" fill="#1f1f1f"/>
  <!-- 마운드 -->
  <path d="M16 13.5 18.5 16 16 18.5 13.5 16Z" fill="#e8f1e8"/>
</svg>
